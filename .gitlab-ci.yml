# Builds exampleSite/ and publishes it as the theme's demo on GitLab Pages.
#
# exampleSite is the only site in this repository, so this pipeline is also the
# theme's only build test — a template that fails to compile fails here. That is
# why branches and merge requests run the same build as Pages does, minus the
# publish step.

stages:
  - test
  - deploy

default:
  image:
    # The official image is the single Hugo binary (the extended edition was
    # folded into it in 0.170). Its entrypoint is hugo itself, so it has to be
    # cleared for GitLab to run a shell in it.
    #
    # Deliberately unpinned. For a theme, "still builds on the Hugo people
    # actually have" is the thing under test, and a pinned tag would hide a
    # breaking Hugo release until someone thought to bump it — the failure would
    # then land on a user rather than on this pipeline. The floor is declared in
    # hugo.toml's [module.hugoVersion] and enforced by Hugo itself; the
    # pre-0.170 extended requirement is checked below, because nothing else
    # would catch it.
    name: ghcr.io/gohugoio/hugo
    entrypoint: [""]

variables:
  # The title block prints dates through Hugo's zone-aware formatting, so the
  # runner's zone leaks into published output if it is left unset.
  TZ: Europe/Berlin
  HUGO_ENV: production
  # CI_PAGES_URL carries the subpath the demo is served under. Set
  # PAGES_BASE_URL as a CI/CD variable to override it — worth reaching for if
  # the instance ever reports a URL it does not actually serve, which is a
  # quiet failure: the HTML loads and every asset under it 404s.
  PAGES_BASE_URL: "$CI_PAGES_URL"

.hugo:
  script:
    # The theme is the repository root. Symlinking it into place, rather than
    # passing --themesDir, keeps the build independent of what the checkout
    # directory is called — CI clones into a path named after the project, and
    # a fork under another name would otherwise stop resolving `theme = "vellum"`.
    - mkdir -p exampleSite/themes
    - ln -sfn ../.. exampleSite/themes/vellum
    # render-image.html encodes its WebP ladder. Before 0.170 only the extended
    # edition could, and a standard binary built green with every image silently
    # fallen back to the source file. 0.170 removed the extended edition and
    # every binary since encodes WebP, so the version string no longer names it;
    # the guard therefore only rejects a standard binary older than 0.170.
    - hugo version
    - |
      hugo version | awk '{ split(substr($2, 2), v, /[.+-]/) } /extended/ || v[1] > 0 || v[2] >= 170 { ok = 1 } END { exit !ok }' || { echo "this theme requires Hugo 0.170 or later, or Hugo extended below that"; exit 1; }
    # The demo is served from a subpath, and the fingerprinted stylesheet, the
    # fonts and every RelPermalink are resolved against this.
    - >
      hugo
      --source exampleSite
      --destination "$CI_PROJECT_DIR/public"
      --baseURL "$PAGES_BASE_URL"
      --minify
      --gc
      --printPathWarnings

build:
  extends: .hugo
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  extends: .hugo
  stage: deploy
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
