# Builds exampleSite/ and publishes it as the theme's demo on GitLab Pages.
#
# exampleSite is the only site in this repository, so this pipeline is also the
# theme's only build test — a template that fails to compile fails here. That is
# why branches and merge requests run the same build as Pages does, minus the
# publish step.

stages:
  - test
  - deploy

default:
  image:
    # The official image builds with HUGO_BUILD_TAGS=extended. Its entrypoint is
    # hugo itself, so it has to be cleared for GitLab to run a shell in it.
    name: ghcr.io/gohugoio/hugo
    entrypoint: [""]

variables:
  # The title block prints dates through Hugo's zone-aware formatting, so the
  # runner's zone leaks into published output if it is left unset.
  TZ: Europe/Berlin
  HUGO_ENV: production
  # CI_PAGES_URL carries the subpath the demo is served under. Set
  # PAGES_BASE_URL as a CI/CD variable to override it — worth reaching for if
  # the instance ever reports a URL it does not actually serve, which is a
  # quiet failure: the HTML loads and every asset under it 404s.
  PAGES_BASE_URL: "$CI_PAGES_URL"

# Hugo writes processed images and other derived resources here. Keyed per
# branch so a Pages build reuses what the preceding branch build produced.
cache:
  key: "hugo-$CI_COMMIT_REF_SLUG"
  paths:
    - exampleSite/resources/_gen/

.hugo:
  script:
    # The theme is the repository root. Symlinking it into place, rather than
    # passing --themesDir, keeps the build independent of what the checkout
    # directory is called — CI clones into a path named after the project, and
    # a fork under another name would otherwise stop resolving `theme = "vellum"`.
    - mkdir -p exampleSite/themes
    - ln -sfn ../.. exampleSite/themes/vellum
    # render-image.html encodes its WebP ladder, which the standard edition
    # cannot do. Without this guard a standard image yields a green pipeline and
    # a site whose every image silently fell back to the source file.
    - hugo version
    - hugo version | grep -q extended || { echo "this theme requires Hugo extended"; exit 1; }
    # The demo is served from a subpath, and the fingerprinted stylesheet, the
    # fonts and every RelPermalink are resolved against this.
    - >
      hugo
      --source exampleSite
      --destination "$CI_PROJECT_DIR/public"
      --baseURL "$PAGES_BASE_URL"
      --minify
      --gc
      --printPathWarnings

build:
  extends: .hugo
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

create-pages:
  extends: .hugo
  stage: deploy
  pages:
    # The folder that contains the files to be exposed at the Page URL.
    publish: public
  # Kept alongside `pages.publish`: GitLab's own Hugo template still declares it,
  # and without it a runner that predates the keyword publishes nothing.
  artifacts:
    paths:
      - public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
