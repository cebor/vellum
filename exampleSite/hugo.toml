baseURL = "https://example.org/"
theme = "vellum"

# The theme is multilingual, so the demo is too: English and German, each with
# its own content directory, menu, profile and search index. A post may exist in
# only one language — two of the posts below deliberately do.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  # Deliberately small. The demo has nine posts and this is what makes the
  # pagination visible on a list; a real site would set this far higher.
  pagerSize = 3

[taxonomies]
  tag = "tags"

# With defaultContentLanguageInSubdir nothing lands at the publish root, so the
# web server has no error document. This writes one to /404.html.
[outputFormats.ROOT404]
  mediaType = "text/html"
  baseName = "404"
  notAlternative = true
  root = true

# --- languages -------------------------------------------------------------

[languages]

  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1
    title = "Vellum"

    [languages.en.params]
      description = "A Hugo theme that sets every page as an engineering drawing sheet."
      # Localised long date. A Go layout string would freeze the month in one
      # language; the shorthand resolves per language.
      DateFormat = ":date_long"

      [languages.en.params.profile]
        title = "Your Name"
        subtitle = "what you do, in one line"
        image = "images/profile.png"
        imageAlt = "Placeholder portrait, drawn as a construction"
        imageWidth = 120

        [[languages.en.params.profile.buttons]]
          name = "Posts"
          url = "posts"

        [[languages.en.params.profile.buttons]]
          name = "Archive"
          url = "archive"

      # Per-language, because .File.Path is relative to that language's
      # contentDir and a single URL could only ever be right for one of them.
      [languages.en.params.editPost]
        URL = "https://github.com/cebor/vellum/edit/main/exampleSite/content/en"
        Text = "Suggest an edit"
        appendFilePath = true

    # The JSON output is the search index; ROOT404 writes the root error
    # document. Default language only — adding ROOT404 to both makes them
    # fight over /404.html.
    [languages.en.outputs]
      home = ["HTML", "RSS", "JSON", "ROOT404"]

    [[languages.en.menus.main]]
      name = "Posts"
      pageRef = "/posts"
      weight = 10

    [[languages.en.menus.main]]
      name = "Tags"
      pageRef = "/tags"
      weight = 20

    [[languages.en.menus.main]]
      name = "Archive"
      pageRef = "/archive"
      weight = 30

    [[languages.en.menus.main]]
      name = "Search"
      pageRef = "/search"
      weight = 40

  [languages.de]
    label = "Deutsch"
    contentDir = "content/de"
    weight = 2
    title = "Vellum"

    [languages.de.params]
      description = "Ein Hugo-Theme, das jede Seite als technische Zeichnung setzt."
      DateFormat = ":date_long"

      [languages.de.params.profile]
        title = "Dein Name"
        subtitle = "was du machst, in einer Zeile"
        image = "images/profile.png"
        imageAlt = "Platzhalter-Porträt, als Konstruktion gezeichnet"
        imageWidth = 120

        [[languages.de.params.profile.buttons]]
          name = "Beiträge"
          url = "posts"

        [[languages.de.params.profile.buttons]]
          name = "Archiv"
          url = "archive"

      [languages.de.params.editPost]
        URL = "https://github.com/cebor/vellum/edit/main/exampleSite/content/de"
        Text = "Korrektur vorschlagen"
        appendFilePath = true

      # Set for German and deliberately left unset for English. footer.html has
      # a `with`/`else` pair here, and this repository has only one site to
      # exercise both with: German builds the custom line (markdownify included),
      # English keeps falling through to the copyright default.
      [languages.de.params.footer]
        text = "Gesetzt als technische Zeichnung. Inhalte unter [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.de)."

    [languages.de.outputs]
      home = ["HTML", "RSS", "JSON"]

    [[languages.de.menus.main]]
      name = "Beiträge"
      pageRef = "/posts"
      weight = 10

    [[languages.de.menus.main]]
      name = "Tags"
      pageRef = "/tags"
      weight = 20

    [[languages.de.menus.main]]
      name = "Archiv"
      pageRef = "/archive"
      weight = 30

    [[languages.de.menus.main]]
      name = "Suche"
      pageRef = "/search"
      weight = 40

# --- shared params ---------------------------------------------------------

[params]
  env = "production"
  author = "Your Name"
  defaultTheme = "auto"
  latestPosts = 5
  mainSections = ["posts"]
  displayFullLangName = true

  # Only reached on pages that carry no tags of their own — the home page, the
  # archive, search — because head.html falls back page keywords, then tags,
  # then this. Set so that last rung is built rather than assumed.
  keywords = ["hugo", "theme", "engineering drawing", "technical writing"]

  # Puts the whole post in the feed instead of the summary. Worth exercising
  # rather than assuming: it is the branch in rss.xml that has to survive the
  # render hooks, and a demo with code-heavy posts is where that shows.
  ShowFullTextinRSS = true

  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowShareButtons = true
  ShowToc = true
  # Shut here, against the theme's own default of open. The panel sits between
  # the title block and the first paragraph, so open it pushes the sheet's
  # opening line down by as much as the index is long — and these demo posts
  # carry enough headings for that to cost the first screen. A site whose posts
  # are longer, or which expects search arrivals after one section, wants the
  # default instead; this is a demo preference, not a correction to it.
  TocOpen = false
  ShareButtons = ["mastodon", "bluesky", "reddit", "hackernews", "linkedin", "email"]

  # Real files in static/, so the icon rungs in head-assets.html are actually
  # rendered by the CI build instead of sitting behind an unset param. Both
  # optional attributes are deliberately left out: one 180x180 apple-touch-icon
  # needs no sizes, and the mask-icon colour is meant to fall through to
  # --accent, which is the path worth exercising because it reads 00-tokens.css.
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    favicon_svg = "/favicon.svg"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"
    manifest = "/site.webmanifest"

  # Named once here rather than in every post that discloses AI use. A post may
  # still override it, and a post without an `ai` key discloses nothing at all.
  [params.ai]
    model = "Claude Opus 5"

  # Placeholder tokens, not real ones. They exist so head.html's three
  # verification rungs are rendered by the build rather than sitting behind an
  # unset param — a site swaps in its own or drops the block entirely.
  [params.analytics]
    [params.analytics.google]
      SiteVerificationTag = "replace-with-your-google-token"
    [params.analytics.bing]
      SiteVerificationTag = "replace-with-your-bing-token"
    [params.analytics.yandex]
      SiteVerificationTag = "replace-with-your-yandex-token"

  [params.cover]
    linkFullImages = true

  [params.schema]
    publisherType = "Person"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

  [[params.socialIcons]]
    name = "mastodon"
    url = "https://mastodon.social/"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.fuseOpts]
    threshold = 0.4
    keys = ["title", "permalink", "summary", "content"]
